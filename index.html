<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f2523">
    <meta name="description" content="Najbliższe odjazdy z ulubionych przystanków w Gdańsku.">
    <title>Odjazdy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="refresh-bar">
        <span id="statusText" aria-live="polite">Pobieranie danych...</span>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Odśwież odjazdy" title="Odśwież">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"></path>
          </svg>
        </button>
      </header>

      <nav class="stop-tabs" id="stopTabs" aria-label="Przystanki"></nav>

      <div id="stopPanels"></div>
    </main>

    <dialog class="stop-manager" id="stopManagerDialog" aria-labelledby="stopManagerTitle">
      <div class="stop-manager-header">
        <div>
          <p class="eyebrow">Ustawienia</p>
          <h2 id="stopManagerTitle">Moje przystanki</h2>
        </div>
        <form method="dialog">
          <button class="dialog-close-button" type="submit" aria-label="Zamknij">×</button>
        </form>
      </div>
      <label class="stop-search-label" for="stopSearch">Wyszukaj nazwę lub numer słupka</label>
      <input class="stop-search" id="stopSearch" type="search" placeholder="np. Oliwa albo 2048" autocomplete="off">
      <p class="stop-manager-status" id="stopManagerStatus" aria-live="polite"></p>
      <ul class="stop-manager-list" id="stopManagerList"></ul>
    </dialog>

    <dialog class="stop-editor" id="stopEditorDialog" aria-labelledby="stopEditorTitle">
      <form class="stop-editor-form" id="stopEditorForm">
        <div class="stop-manager-header">
          <div>
            <p class="eyebrow">Układ przystanku</p>
            <h2 id="stopEditorTitle">Edytuj przystanek</h2>
          </div>
          <button class="dialog-close-button" id="closeStopEditorButton" type="button" aria-label="Zamknij bez zapisywania">×</button>
        </div>
        <div class="stop-editor-body">
          <p class="stop-editor-intro">Przeciągnij słupki albo użyj strzałek. Przekreślone oko ukrywa słupek razem z jego odjazdami.</p>
          <ul class="stop-editor-list" id="stopEditorList"></ul>
          <div class="stop-editor-actions">
            <button class="secondary-button" id="cancelStopEditorButton" type="button">Anuluj</button>
            <button class="primary-button" type="submit">Zapisz zmiany</button>
          </div>
          <section class="stop-editor-danger-zone" aria-labelledby="deleteStopGroupTitle">
            <h3 id="deleteStopGroupTitle">Usuwanie przystanku</h3>
            <button class="secondary-button danger-button" id="deleteStopGroupButton" type="button"></button>
            <div class="delete-stop-group-confirmation" id="deleteStopGroupConfirmation" hidden>
              <p id="deleteStopGroupMessage"></p>
              <div>
                <button class="secondary-button" id="cancelDeleteStopGroupButton" type="button">Anuluj</button>
                <button class="primary-button danger-primary-button" id="confirmDeleteStopGroupButton" type="button">Usuń</button>
              </div>
            </div>
          </section>
        </div>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
