<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f2523">
    <meta name="description" content="Najbliższe odjazdy tramwajów z przystanku Opacka.">
    <title>Opacka</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Przystanek</p>
          <h1>Opacka</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Odśwież odjazdy" title="Odśwież">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"></path>
          </svg>
        </button>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="statusText">Ładowanie odjazdów...</span>
        <span id="updatedText"></span>
      </section>

      <section class="departures" aria-label="Odjazdy">
        <article class="stop-panel" data-stop-card="2048">
          <div class="stop-heading">
            <div>
              <p class="stop-code">Słupek 2048</p>
              <h2>Do centrum i Wrzeszcza</h2>
            </div>
            <span class="direction-pill">Opacka 02</span>
          </div>
          <ul class="departure-list" id="departures-2048"></ul>
        </article>

        <article class="stop-panel" data-stop-card="2047">
          <div class="stop-heading">
            <div>
              <p class="stop-code">Słupek 2047</p>
              <h2>Do Jelitkowa i Zaspy</h2>
            </div>
            <span class="direction-pill">Opacka</span>
          </div>
          <ul class="departure-list" id="departures-2047"></ul>
        </article>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
