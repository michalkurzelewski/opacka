<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f2523">
    <meta name="description" content="Najbliższe odjazdy z ulubionych przystanków w Gdańsku.">
    <title>Odjazdy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Przystanki</p>
          <h1 id="currentStopTitle">Odjazdy</h1>
          <p class="topbar-note" id="currentStopNote"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="manageStopsButton" type="button" aria-label="Zarządzaj przystankami" title="Moje przystanki">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
          </button>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Odśwież odjazdy" title="Odśwież">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="statusText">Ładowanie odjazdów...</span>
        <span id="updatedText"></span>
      </section>

      <nav class="stop-tabs" id="stopTabs" role="tablist" aria-label="Przystanki"></nav>

      <div id="stopPanels"></div>
    </main>

    <dialog class="stop-manager" id="stopManagerDialog" aria-labelledby="stopManagerTitle">
      <div class="stop-manager-header">
        <div>
          <p class="eyebrow">Ustawienia</p>
          <h2 id="stopManagerTitle">Moje przystanki</h2>
        </div>
        <form method="dialog">
          <button class="dialog-close-button" type="submit" aria-label="Zamknij">×</button>
        </form>
      </div>
      <label class="stop-search-label" for="stopSearch">Wyszukaj nazwę lub numer słupka</label>
      <input class="stop-search" id="stopSearch" type="search" placeholder="np. Oliwa albo 2048" autocomplete="off">
      <p class="stop-manager-status" id="stopManagerStatus" aria-live="polite"></p>
      <ul class="stop-manager-list" id="stopManagerList"></ul>
    </dialog>

    <dialog class="alias-dialog" id="aliasDialog" aria-labelledby="aliasDialogTitle">
      <form id="aliasForm">
        <div class="stop-manager-header">
          <div>
            <p class="eyebrow">Nazwa słupka</p>
            <h2 id="aliasDialogTitle">Nadaj alias</h2>
          </div>
          <button class="dialog-close-button" id="closeAliasButton" type="button" aria-label="Zamknij">×</button>
        </div>
        <div class="alias-dialog-body">
          <p class="alias-original-name">Oryginalna nazwa: <strong id="aliasStopName"></strong></p>
          <label class="stop-search-label" for="aliasInput">Twój alias</label>
          <input class="stop-search" id="aliasInput" type="text" maxlength="40" placeholder="np. Do pracy" autocomplete="off">
          <div class="alias-dialog-actions">
            <button class="secondary-button danger-button" id="removeAliasButton" type="button">Usuń alias</button>
            <button class="primary-button" type="submit">Zapisz</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
